<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor · edulab</title>
    <link rel="stylesheet" href="tokens/colors_and_type.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.3/codemirror.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.3/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.3/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; }

        /* --- Branded top menu (required chrome) --- */
        .edu-header {
            position: sticky; top: 0; z-index: 50; width: 100%;
            background: rgba(251, 247, 240, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }
        .edu-header-inner {
            max-width: 1100px; margin: 0 auto;
            padding: 15px 30px; display: flex; align-items: center; gap: 12px;
        }
        .edu-logo { width: 32px; height: 32px; display: block; }
        .edu-wordmark {
            font-family: var(--font-display); font-weight: 700; font-size: 22px;
            letter-spacing: -.02em; color: var(--ink);
        }
        .edu-tag {
            font-family: var(--font-mono); font-weight: 500; font-size: 11px;
            letter-spacing: .14em; text-transform: uppercase; color: var(--teal-ink);
            background: var(--teal-soft); padding: 4px 9px; border-radius: var(--r-pill);
        }

        /* --- Shell + page header --- */
        .shell { max-width: 1100px; margin: 0 auto; padding: 34px 30px 70px; }
        .page-head { text-align: center; margin-bottom: var(--sp-8); }
        .page-head .edu-overline { margin: 0 0 var(--sp-3); }
        .app-title {
            font-family: var(--font-display); font-weight: 800;
            font-size: clamp(2rem, 4.5vw, 2.85rem); letter-spacing: -.025em;
            line-height: 1.05; color: var(--ink); margin: 0 0 var(--sp-4);
        }
        .edu-lead {
            font-family: var(--font-sans); font-size: 1.0625rem; line-height: 1.6;
            color: var(--ink-2); max-width: 36rem; margin: 0 auto var(--sp-5);
        }

        /* --- Workspace: editor + preview panes --- */
        .workspace {
            display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
            margin-top: var(--sp-6);
        }
        @media (max-width: 860px) { .workspace { grid-template-columns: 1fr; } }
        .pane {
            background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; overflow: hidden;
            height: 62vh; min-height: 420px;
        }
        .pane-head {
            font-family: var(--font-mono); font-weight: 500; font-size: 11px;
            letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
            padding: 12px 18px; border-bottom: 1px solid var(--line);
        }
        .editor-well { flex: 1; min-height: 0; background: var(--ink); }
        .output {
            flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px;
        }

        /* --- Primary action --- */
        .actions { text-align: center; margin-top: var(--sp-8); }
        .edu-btn {
            font-family: var(--font-display); font-weight: 600; font-size: 16px;
            background: var(--marigold); color: var(--on-primary); border: none;
            border-radius: var(--r-pill); padding: 12px 26px; cursor: pointer;
            box-shadow: var(--shadow-marigold);
            transition: background .15s ease, transform .12s cubic-bezier(.32,.72,.32,1);
        }
        .edu-btn:hover { background: var(--marigold-600); }
        .edu-btn:active { transform: scale(.96); }
        .edu-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    </style>
</head>
<body class="edu">
    <header class="edu-header">
        <div class="edu-header-inner">
            <img class="edu-logo" alt="edulab" src="assets/edulab-mark-teal.png">
            <span class="edu-wordmark">edulab</span>
            <span class="edu-tag">demo lab</span>
        </div>
    </header>
    <main class="shell">
        <header class="page-head">
            <p class="edu-overline">Interactive tool · markdown</p>
            <h1 class="app-title">Markdown Editor</h1>
            <p class="edu-lead">Write markdown on the left, watch it render live on the right, and download the result as a PDF.</p>
        </header>
        <section class="workspace">
            <div class="pane">
                <div class="pane-head">Markdown input</div>
                <div class="editor-well">
                    <textarea id="markdown"># Markdown Tutorial

Markdown is a lightweight markup language that you can use to add formatting elements to plaintext text documents. Here's a quick guide to get you started.

## Headings

You can create headings by starting a line with one or more `#` followed by a space. The number of `#` symbols indicates the heading level.


# This is an H1
## This is an H2
### This is an H3


## Emphasis

To italicize text, use one `*` or `_` around the text. For bold text, use two `*` or `_`.


*italic* or _italic_

**bold** or __bold__


## Lists

### Unordered Lists

Use `-`, `*`, or `+` to create an unordered list.


- Item 1
- Item 2
  - Subitem 1
  - Subitem 2


### Ordered Lists

Use numbers followed by a period to create an ordered list.


1. First item
2. Second item
3. Third item


## Links

To create a hyperlink, enclose the link text in brackets `[ ]`, and then follow it immediately with the URL in parentheses `( )`.


[OpenAI](https://www.openai.com)


## Images

Similar to links, but add an exclamation mark `!` before the brackets.


![Alt text](https://icons.iconarchive.com/icons/iconarchive/rocking-horse/256/Rocking-Horse-Wood-icon.png)


## Blockquotes

Use `>` to create blockquotes.


> This is a blockquote.
> It can span multiple lines.


## Code

Enclose inline code within backticks `` ` ``.


Here is some `inline code`.

For blocks of code, use three backticks ``` or indent lines with four spaces.


```python
def hello_world():
    print("Hello, world!")
```

## Horizontal Rules

Create a horizontal rule by using three or more hyphens, asterisks, or underscores on a line by themselves.

---
***
___

## Tables

Create tables using pipes `|` and hyphens `-` to separate columns and rows.

| Header 1 | Header 2 |
| -------- | -------- |
| Row 1    | Data 1   |
| Row 2    | Data 2   |
  
  
That's it! You now know the basics of Markdown. Happy writing!
</textarea>
                </div>
            </div>
            <div class="pane">
                <div class="pane-head">Rendered output</div>
                <div id="rendered" class="output"></div>
            </div>
        </section>
        <div class="actions">
            <button id="download" class="edu-btn">Download as PDF</button>
        </div>
    </main>
    <script>
        const markdownInput = CodeMirror.fromTextArea(document.getElementById('markdown'), {
            mode: 'markdown',
            lineNumbers: true,
        });
        const renderedOutput = document.getElementById('rendered');
        const downloadButton = document.getElementById('download');

        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        function updateRenderedOutput() {
            const markdownText = markdownInput.getValue();
            const htmlContent = marked.parse(markdownText);
            renderedOutput.innerHTML = htmlContent;
        }

        markdownInput.on('change', updateRenderedOutput);

        downloadButton.addEventListener('click', () => {
            const element = document.createElement('div');
            element.innerHTML = renderedOutput.innerHTML;
            const opt = {
                margin: [1, 1, 1, 1], // top, left, bottom, right (in inches)
                filename: 'markdown.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        });

        // Initial render
        updateRenderedOutput();
    </script>
</body>
</html>
